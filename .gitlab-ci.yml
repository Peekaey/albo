# Build a Docker image with CI/CD and push to the GitLab registry.
# Docker-in-Docker documentation: https://docs.gitlab.com/ci/docker/using_docker_build/
#
# This template uses one generic job with conditional builds
# for the default branch and all other (MR) branches.

docker-build:
  # Use the official docker image.
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    # Set up buildx for multi-architecture builds
    - docker buildx create --use --name multiarch-builder || true
    - docker buildx inspect --bootstrap
  script:
    # Build and push multi-architecture image
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --pull \
        --push \
        -t "$DOCKER_IMAGE_NAME" \
        .
    # Tag and push latest for default branch
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --pull \
          --push \
          -t "$CI_REGISTRY_IMAGE:latest" \
          .
      fi
  # Run this job in a branch where a Dockerfile exists && is main branch
  rules:
    - if: $CI_COMMIT_BRANCH == "main"'
    - exists:
        - Dockerfile
