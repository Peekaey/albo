stages:
  - build

build_job:
  stage: build
  image: docker:latest
  variables:
    # This forces the client to use the socket we mounted in config.toml
    DOCKER_HOST: unix:///var/run/docker.sock
    # We disable TLS because we are using a local socket, not a network port
    DOCKER_TLS_CERTDIR: ""
  
  tags:
    - builds # Double check this matches your Runner's tag in GitLab UI

  script:
    # 1. Debug: Confirm the container can see the socket
    - ls -la /var/run/docker.sock
    
    # 2. Login
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    
    # 3. Build and Push
    - docker build -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"