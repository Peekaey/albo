stages:
  - build

build-docker:
  image: docker:latest
  stage: build
  
  # -------------------------------------------------------------------------
  # KEY CHANGES:
  # 1. Removed 'services: - docker:dind' (We use the host's Docker instead)
  # 2. Removed 'DOCKER_TLS_CERTDIR' (Not needed for socket connection)
  # -------------------------------------------------------------------------

  variables:
    # Explicitly tell the docker client to use the mounted socket
    DOCKER_HOST: unix:///var/run/docker.sock

  tags:
    - builds  # Ensure this matches your runner tag

  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"