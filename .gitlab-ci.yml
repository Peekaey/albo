variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  DOCKER_DIND: "docker:20.10.16-dind"                                                          
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  FF_NETWORK_PER_BUILD: "true"

docker-build:amd64:
  stage: build
  image: docker:cli
  services:
    - $DOCKER_DIND
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # Debug: Check what we can see
    - echo "Checking Docker socket..."
    - ls -la /var/run/ || echo "No /var/run/"
    - ls -la /var/run/docker.sock || echo "No docker.sock"
    - mount | grep docker || echo "No docker mounts"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --platform linux/amd64 --pull -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      exists:
        - Dockerfile
  tags:
    - builds