variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

docker-build:amd64:
  stage: build
  image: moby/buildkit:rootless
  script:
    # Start buildkitd in rootless mode
    - |
      buildkitd --oci-worker-no-process-sandbox &
      BUILDKIT_PID=$!
      sleep 5
    
    # Login to registry
    - |
      mkdir -p ~/.docker
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > ~/.docker/config.json
    
    # Build and push
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name="${DOCKER_IMAGE_NAME}",push=true \
        --export-cache type=inline \
        --import-cache type=registry,ref="${DOCKER_IMAGE_NAME}"
    
    # Tag as latest for main branch
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        buildctl build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output type=image,name="${CI_REGISTRY_IMAGE}:latest",push=true
      fi
    
    # Cleanup
    - kill $BUILDKIT_PID || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      exists:
        - Dockerfile
  tags:
    - builds